name: Copy terrain installer to draft release

on:
  workflow_dispatch:
    inputs:
      target_tag:
        description: Existing draft release tag
        required: true
        default: acmi-2026.10.25
        type: string
      source_tag:
        description: Published release containing the installer
        required: true
        default: acmi-2026.10.24.1
        type: string
      expected_commit:
        description: Exact commit recorded by the target release
        required: true
        default: 589aed8c25c4be7fd595a0453ea5f13039fed888
        type: string

permissions:
  contents: write

concurrency:
  group: copy-release-terrain-${{ github.repository }}
  cancel-in-progress: false

jobs:
  attach-terrain:
    name: Verify and attach terrain installer
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_TAG: ${{ inputs.target_tag }}
      SOURCE_TAG: ${{ inputs.source_tag }}
      EXPECTED_COMMIT: ${{ inputs.expected_commit }}
      CONVERTER_ASSET: wrpl-acmi.exe
      TERRAIN_ASSET: wrpl-terrain-installer.exe
      TERRAIN_SHA256: 7e1c6632fe23108bc35488ae245c3e08271d4f9434f77192a564f3437096afbc

    steps:
      - name: Validate tag and fixed asset inputs
        shell: bash
        run: |
          set -euo pipefail

          tag_pattern='^acmi-[0-9]{4}\.[0-9]{2}\.[0-9]{2}(\.[0-9]+)?$'
          tag_prefix='acmi-'

          if [[ "$CONVERTER_ASSET" != 'wrpl-acmi.exe' ]]; then
            echo 'Unexpected converter asset name.' >&2
            exit 1
          fi
          if [[ "$TERRAIN_ASSET" != 'wrpl-terrain-installer.exe' ]]; then
            echo 'Unexpected terrain asset name.' >&2
            exit 1
          fi
          if [[ ! "$EXPECTED_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'expected_commit must be a lowercase 40-character commit SHA.' >&2
            exit 1
          fi

          for tag in "$TARGET_TAG" "$SOURCE_TAG"; do
            if [[ "$tag" != "$tag_prefix"* ]]; then
              echo "Tag must start with ${tag_prefix}: ${tag}" >&2
              exit 1
            fi
            if [[ ! "$tag" =~ $tag_pattern ]]; then
              echo "Tag has an unsupported form: ${tag}" >&2
              exit 1
            fi
          done

          if [[ "$TARGET_TAG" == "$SOURCE_TAG" ]]; then
            echo 'Source and target tags must differ.' >&2
            exit 1
          fi

          work_dir="$RUNNER_TEMP/copy-release-terrain"
          mkdir -p "$work_dir/source"
          echo "WORK_DIR=$work_dir" >> "$GITHUB_ENV"

      - name: Verify releases before transfer
        shell: bash
        env:
          WORK_DIR: ${{ runner.temp }}/copy-release-terrain
        run: |
          set -euo pipefail

          gh release view "$TARGET_TAG" --repo "$GITHUB_REPOSITORY" \
            --json databaseId,isDraft,tagName,targetCommitish,assets \
            > "$WORK_DIR/target-before.json"
          EXPECTED_RELEASE_ID="$(jq -r '.databaseId' "$WORK_DIR/target-before.json")"
          echo "EXPECTED_RELEASE_ID=$EXPECTED_RELEASE_ID" >> "$GITHUB_ENV"
          gh release view "$SOURCE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json isDraft,isPrerelease,tagName,assets \
            > "$WORK_DIR/source.json"

          if ! jq -e \
            --arg tag "$TARGET_TAG" \
            --arg id "$EXPECTED_RELEASE_ID" \
            --arg commit "$EXPECTED_COMMIT" \
            --arg converter "$CONVERTER_ASSET" \
            --arg terrain "$TERRAIN_ASSET" '
              .tagName == $tag and
              (.databaseId | tostring) == $id and
              .isDraft == true and
              ((.targetCommitish | ascii_downcase) == $commit) and
              ([.assets[].name] == [$converter]) and
              (all(.assets[]; .name != $terrain))
            ' "$WORK_DIR/target-before.json" >/dev/null; then
            echo 'Target release is not the expected draft with only the converter.' >&2
            cat "$WORK_DIR/target-before.json" >&2
            exit 1
          fi

          if ! jq -e \
            --arg tag "$SOURCE_TAG" \
            --arg terrain "$TERRAIN_ASSET" '
              .tagName == $tag and
              .isDraft == false and
              .isPrerelease == false and
              (any(.assets[]; .name == $terrain))
            ' "$WORK_DIR/source.json" >/dev/null; then
            echo 'Source release is not a published release containing the fixed installer.' >&2
            cat "$WORK_DIR/source.json" >&2
            exit 1
          fi

      - name: Download and verify terrain installer
        shell: bash
        env:
          WORK_DIR: ${{ runner.temp }}/copy-release-terrain
        run: |
          set -euo pipefail

          gh release download "$SOURCE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$TERRAIN_ASSET" \
            --dir "$WORK_DIR/source"
          installer="$WORK_DIR/source/$TERRAIN_ASSET"
          [[ -f "$installer" ]]
          actual_sha="$(sha256sum "$installer" | awk '{print $1}')"
          if [[ "$actual_sha" != "$TERRAIN_SHA256" ]]; then
            echo 'Terrain installer SHA256 mismatch.' >&2
            echo "Expected: $TERRAIN_SHA256" >&2
            echo "Actual:   $actual_sha" >&2
            exit 1
          fi

      - name: Recheck draft and upload without overwrite
        shell: bash
        env:
          WORK_DIR: ${{ runner.temp }}/copy-release-terrain
        run: |
          set -euo pipefail

          # Recheck immediately before the upload. gh release upload has no
          # --clobber flag here, so an existing terrain asset is also rejected.
          gh release view "$TARGET_TAG" --repo "$GITHUB_REPOSITORY" \
            --json databaseId,isDraft,tagName,targetCommitish,assets \
            > "$WORK_DIR/target-before-upload.json"
          if ! jq -e \
            --arg tag "$TARGET_TAG" \
            --arg id "$EXPECTED_RELEASE_ID" \
            --arg commit "$EXPECTED_COMMIT" \
            --arg converter "$CONVERTER_ASSET" \
            --arg terrain "$TERRAIN_ASSET" '
              .tagName == $tag and
              (.databaseId | tostring) == $id and
              .isDraft == true and
              ((.targetCommitish | ascii_downcase) == $commit) and
              ([.assets[].name] == [$converter]) and
              (all(.assets[]; .name != $terrain))
            ' "$WORK_DIR/target-before-upload.json" >/dev/null; then
            echo 'Refusing to upload: target draft state changed or installer already exists.' >&2
            cat "$WORK_DIR/target-before-upload.json" >&2
            exit 1
          fi

          gh release upload "$TARGET_TAG" \
            "$WORK_DIR/source/$TERRAIN_ASSET" \
            --repo "$GITHUB_REPOSITORY"

          gh release view "$TARGET_TAG" --repo "$GITHUB_REPOSITORY" \
            --json databaseId,isDraft,tagName,targetCommitish,assets \
            > "$WORK_DIR/target-after.json"

          terrain_size="$(stat -c '%s' "$WORK_DIR/source/$TERRAIN_ASSET")"

          if ! jq -e \
            --arg tag "$TARGET_TAG" \
            --arg id "$EXPECTED_RELEASE_ID" \
            --arg commit "$EXPECTED_COMMIT" \
            --arg converter "$CONVERTER_ASSET" \
            --arg terrain "$TERRAIN_ASSET" \
            --argjson terrain_size "$terrain_size" '
              .tagName == $tag and
              (.databaseId | tostring) == $id and
              .isDraft == true and
              ((.targetCommitish | ascii_downcase) == $commit) and
              (([.assets[].name] | sort) == ([$converter, $terrain] | sort)) and
              (all(.assets[];
                if .name == $terrain then .size == $terrain_size
                elif .name == $converter then true
                else false
                end
              ))
            ' "$WORK_DIR/target-after.json" >/dev/null; then
            echo 'Post-upload release state or asset set is invalid.' >&2
            cat "$WORK_DIR/target-after.json" >&2
            exit 1
          fi

          converter_size="$(jq -r --arg name "$CONVERTER_ASSET" \
            '.assets[] | select(.name == $name) | .size' \
            "$WORK_DIR/target-after.json")"

          {
            echo '## Draft release asset copy'
            echo
            echo "- Repository: ${GITHUB_REPOSITORY}"
            echo "- Target tag: ${TARGET_TAG}"
            echo "- Target release id: ${EXPECTED_RELEASE_ID}"
            echo "- Target commit: ${EXPECTED_COMMIT}"
            echo "- Source tag: ${SOURCE_TAG}"
            echo "- State: still draft; this workflow did not publish it"
            echo
            echo '| Asset | Size (bytes) | SHA256 |'
            echo '| --- | ---: | --- |'
            printf '| %s | %s | `%s` |\n' "$CONVERTER_ASSET" "$converter_size" "verified separately"
            printf '| %s | %s | `%s` |\n' "$TERRAIN_ASSET" "$terrain_size" "$TERRAIN_SHA256"
          } >> "$GITHUB_STEP_SUMMARY"
